<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D9E75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Receipts">
<title>Receipt Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; color: #1a1a18; min-height: 100vh; }
  header { background: #1D9E75; color: white; padding: 16px 20px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; font-weight: 500; }
  header span { font-size: 22px; }
  .count-badge { margin-left: auto; background: rgba(255,255,255,0.25); border-radius: 12px; padding: 3px 10px; font-size: 13px; }
  .main { padding: 20px; max-width: 480px; margin: 0 auto; }
  .capture-card { background: white; border-radius: 16px; border: 0.5px solid #d3d1c7; padding: 24px 20px; text-align: center; margin-bottom: 20px; }
  .camera-area { border: 2px dashed #9FE1CB; border-radius: 12px; padding: 32px 16px; margin-bottom: 16px; cursor: pointer; transition: background 0.15s; }
  .camera-area:hover { background: #f0faf6; }
  .camera-area img.preview { width: 100%; border-radius: 8px; display: block; }
  .camera-icon { width: 56px; height: 56px; background: #E1F5EE; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 24px; }
  .camera-area p { color: #5F5E5A; font-size: 14px; }
  .camera-area p strong { color: #0F6E56; display: block; font-size: 16px; margin-bottom: 4px; font-weight: 500; }
  input[type="file"] { display: none; }
  .btn-row { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #1D9E75; color: white; }
  .btn-secondary { background: #E1F5EE; color: #0F6E56; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .folder-setting { background: white; border-radius: 12px; border: 0.5px solid #d3d1c7; padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .folder-setting input { flex: 1; border: none; outline: none; font-size: 14px; color: #1a1a18; background: transparent; }
  .folder-label { font-size: 12px; color: #888780; display: block; margin-bottom: 2px; }
  .receipts-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .receipts-header h2 { font-size: 16px; font-weight: 500; }
  .clear-btn { font-size: 13px; color: #888780; background: none; border: none; cursor: pointer; padding: 4px; }
  .receipt-list { display: flex; flex-direction: column; gap: 10px; }
  .receipt-item { background: white; border-radius: 12px; border: 0.5px solid #d3d1c7; display: flex; align-items: center; gap: 12px; padding: 10px 14px; overflow: hidden; }
  .receipt-thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #f4f4f0; }
  .receipt-info { flex: 1; overflow: hidden; }
  .receipt-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .receipt-date { font-size: 12px; color: #888780; margin-top: 2px; }
  .receipt-size { font-size: 11px; color: #B4B2A9; margin-top: 1px; }
  .download-btn { background: #E1F5EE; color: #0F6E56; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; flex-shrink: 0; font-weight: 500; }
  .empty-state { text-align: center; padding: 32px 16px; color: #888780; font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #2C2C2A; color: white; padding: 10px 20px; border-radius: 24px; font-size: 14px; transition: transform 0.3s ease; z-index: 100; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .status-bar { background: #E1F5EE; color: #0F6E56; font-size: 13px; padding: 8px 16px; border-radius: 8px; margin-bottom: 16px; text-align: center; }
</style>
</head>
<body>

<header>
  <span>🧾</span>
  <h1>Receipt Scanner</h1>
  <span class="count-badge" id="count-badge">0 saved</span>
</header>

<div class="main">
  <div class="status-bar" id="status-bar">Tap the camera area to take a photo or pick from gallery</div>

  <div class="capture-card">
    <div class="camera-area" id="camera-area" onclick="document.getElementById('file-input').click()">
      <div id="placeholder">
        <div class="camera-icon">📷</div>
        <p><strong>Tap to capture receipt</strong>Camera or gallery</p>
      </div>
      <img class="preview" id="preview-img" style="display:none;" alt="Receipt preview">
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">Gallery</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveReceipt()" disabled>Save receipt</button>
    </div>
  </div>

  <div class="folder-setting">
    <span>📁</span>
    <div style="flex:1;">
      <span class="folder-label">Filename prefix</span>
      <input type="text" id="prefix-input" value="receipt" placeholder="receipt">
    </div>
  </div>

  <div class="receipts-header">
    <h2>Saved this session</h2>
    <button class="clear-btn" onclick="clearAll()">Clear all</button>
  </div>

  <div class="receipt-list" id="receipt-list">
    <div class="empty-state">No receipts saved yet</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let currentBlob = null;
  let receipts = [];
  try { receipts = JSON.parse(localStorage.getItem('receipts') || '[]'); } catch(e) {}

  const fileInput = document.getElementById('file-input');
  const previewImg = document.getElementById('preview-img');
  const placeholder = document.getElementById('placeholder');
  const saveBtn = document.getElementById('save-btn');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    currentBlob = file;
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    previewImg.style.display = 'block';
    placeholder.style.display = 'none';
    saveBtn.disabled = false;
    updateStatus('Image loaded — tap Save receipt to store it');
  });

  function saveReceipt() {
    if (!currentBlob) return;
    const prefix = document.getElementById('prefix-input').value.trim() || 'receipt';
    const now = new Date();
    const ts = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    const filename = prefix + '_' + ts + '.jpg';
    const reader = new FileReader();
    reader.onload = function(ev) {
      const entry = { name: filename, data: ev.target.result, date: now.toLocaleString('da-DK'), size: formatSize(currentBlob.size) };
      receipts.unshift(entry);
      try { localStorage.setItem('receipts', JSON.stringify(receipts)); } catch(e) {}
      renderList();
      downloadFile(currentBlob, filename);
      showToast('Saved: ' + filename);
      updateStatus('Receipt saved. Move file from Downloads to your OneDrive folder.');
      resetCapture();
    };
    reader.readAsDataURL(currentBlob);
  }

  function downloadFile(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function resetCapture() {
    currentBlob = null;
    previewImg.style.display = 'none';
    placeholder.style.display = 'block';
    previewImg.src = '';
    saveBtn.disabled = true;
    fileInput.value = '';
  }

  function renderList() {
    const list = document.getElementById('receipt-list');
    document.getElementById('count-badge').textContent = receipts.length + ' saved';
    if (receipts.length === 0) { list.innerHTML = '<div class="empty-state">No receipts saved yet</div>'; return; }
    list.innerHTML = receipts.map((r, i) => `
      <div class="receipt-item">
        <img class="receipt-thumb" src="${r.data}" alt="Receipt">
        <div class="receipt-info">
          <div class="receipt-name">${r.name}</div>
          <div class="receipt-date">${r.date}</div>
          <div class="receipt-size">${r.size}</div>
        </div>
        <button class="download-btn" onclick="redownload(${i})">↓ Save</button>
      </div>`).join('');
  }

  function redownload(i) {
    const r = receipts[i];
    fetch(r.data).then(res => res.blob()).then(blob => downloadFile(blob, r.name));
  }

  function clearAll() {
    receipts = [];
    try { localStorage.removeItem('receipts'); } catch(e) {}
    renderList();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function updateStatus(msg) { document.getElementById('status-bar').textContent = msg; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  renderList();
</script>
</body>
</html>
